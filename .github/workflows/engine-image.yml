# Build the engine image with its knowledge index, run the engine tests and a few checks
# inside it. On pull requests that change the engine it pushes nothing; on a release tag
# (2026.11.27) it pushes the image to ghcr.io with that version and latest
# (docs/develop/contributing.qmd#release).
name: Engine image

on:
  pull_request:
    paths: ["engine/**", "knowledge/**", "scripts/setup_knowledge.py", "scripts/build_package_knowledge.py", ".github/workflows/engine-image.yml"]
  push:
    tags: ["20*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: engine-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: omicsbase-engine:ci
  REGISTRY_IMAGE: ghcr.io/0xmuluh/omicsbase-engine

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # The image is about 14 GB unpacked; a fresh runner has less free space than that.
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # knowledge.db is not in git: the pinned books in knowledge/sources.json plus the
      # committed help pages and vignettes in engine/knowledge/package_docs.json.
      - name: Knowledge index
        run: |
          pip install -q -r knowledge/requirements.txt
          python3 scripts/setup_knowledge.py
          python3 scripts/build_package_knowledge.py --skip-extract --db engine/knowledge/knowledge.db
      - name: Build
        env:
          GITHUB_PAT: ${{ github.token }}
        run: docker build --progress=plain --secret id=github_pat,env=GITHUB_PAT -t "$IMAGE" engine
      - name: Size and free space
        run: |
          docker image inspect --format '{{.Size}}' "$IMAGE" | numfmt --to=si --suffix=B
          df -h /
      # The knowledge tests also read the repository's knowledge/ and scripts/.
      - name: Engine tests
        run: |
          failed=""
          for test in engine/tests/test_*.py; do
            echo "::group::$test"
            docker run --rm --user 0 -e PROJECTS_DIR=/tmp/projects \
              -v "$PWD/engine/tests:/app/engine/tests:ro" -v "$PWD/knowledge:/app/knowledge:ro" \
              -v "$PWD/scripts:/app/scripts:ro" --entrypoint sh "$IMAGE" -c \
              "cd /app && pip install -q pytest httpx && python3 -m pytest -q -p no:cacheprovider $test" \
              || failed="$failed $test"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
      - name: Packages load as the random LUMI-K user
        run: |
          docker run --rm --user 1000770000:0 -e HOME=/tmp -e PROJECTS_DIR=/tmp/projects \
            --entrypoint sh "$IMAGE" -c '
              set -e
              quarto --version
              python3 -c "import engine.server, mofapy2"
              Rscript -e "for (p in c(\"Seurat\", \"clusterProfiler\", \"MicrobiomeStat\", \"mia\", \"MOFA2\", \"IlluminaHumanMethylation450kanno.ilmn12.hg19\")) suppressPackageStartupMessages(library(p, character.only = TRUE))" \
                -e "stopifnot(reticulate::py_module_available(\"mofapy2\"))" \
                -e "stopifnot(nrow(getAnnotation(IlluminaHumanMethylation450kanno.ilmn12.hg19)) > 400000)"'
      - name: Push the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf 'FROM %s\nLABEL org.opencontainers.image.source=https://github.com/0xMuluh/omicsbase org.opencontainers.image.licenses=MIT org.opencontainers.image.version=%s org.opencontainers.image.description="OmicsBase engine"\n' \
            "$IMAGE" "$VERSION" | docker build -t "$REGISTRY_IMAGE:$VERSION" -t "$REGISTRY_IMAGE:latest" -
          docker push "$REGISTRY_IMAGE:$VERSION"
          docker push "$REGISTRY_IMAGE:latest"
      # Help pages, vignettes and exports of the packages in this image, for
      # engine/knowledge/package_docs.json and package_exports.json. Commit them from the
      # artifact when the R packages change.
      - name: Package knowledge
        continue-on-error: true
        run: |
          mkdir -p package-knowledge
          docker run --rm --user 0 -v "$PWD/scripts:/app/scripts:ro" -v "$PWD/package-knowledge:/out" \
            --entrypoint sh "$IMAGE" -c \
            "cp /app/engine/knowledge/knowledge.db /tmp/knowledge.db && cd /app && python3 scripts/build_package_knowledge.py \
               --db /tmp/knowledge.db --output-json /out/package_docs.json --exports-json /out/package_exports.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-knowledge
          path: package-knowledge/
          if-no-files-found: ignore
