version: 1.2.0

cache: true

balance:
  enabled: true
  startBalance: 50000000
  autoRefillEnabled: true
  refillIntervalValue: 5
  refillIntervalUnit: 'hours'
  refillAmount: 50000000

interface:
  appTitle: "OmicsBase"
  modelSelect: true
  customFooter: "OmicsBase | University of Turku | [Support](mailto:gtmulu@utu.fi)"

  privacyPolicy:
    externalUrl: "https://www.utu.fi/en/privacy"
    openNewTab: true

  termsOfService:
    externalUrl: "https://www.utu.fi/en/university/it-services"
    openNewTab: true

fileConfig:
  endpoints:
    default:
      supportedMimeTypes:
        - "image/.*"
        - "text/.*"
        - "application/pdf"
        - "application/json"
        - "application/xml"
        - "application/zip"
        - "application/x-zip-compressed"
        - "application/x-tar"
        - "application/gzip"
        - "application/x-gzip"
        - "application/x-r-rds"
        - "application/x-parquet"
        - "application/vnd.apache.parquet"
        - "application/x-hdf"
        - "application/x-hdf5"
        - "application/octet-stream"
    custom:
      supportedMimeTypes:
        - "image/.*"
        - "text/.*"
        - "application/pdf"
        - "application/json"
        - "application/xml"
        - "application/zip"
        - "application/x-zip-compressed"
        - "application/x-tar"
        - "application/gzip"
        - "application/x-gzip"
        - "application/x-r-rds"
        - "application/x-parquet"
        - "application/vnd.apache.parquet"
        - "application/x-hdf"
        - "application/x-hdf5"
        - "application/octet-stream"

mcpSettings:
  allowedDomains:
    - 'omicsbase-engine-omicsbase-utu.apps.lumi-k.eu'
    - 'engine'
    - 'http://engine:8001'
    - 'host.docker.internal'
    - 'localhost'
  allowedAddresses:
    - 'engine:8001'

mcpServers:
  notethreads:
    type: sse
    # Notes run on LUMI-K; the VM engine (http://engine:8001/sse) is the fallback.
    url: https://omicsbase-engine-omicsbase-utu.apps.lumi-k.eu/sse
    timeout: 660000
    serverInstructions: true

endpoints:
  agents:
    # Each tool call uses two graph steps; 24 allows about 11 calls per turn (lookups included).
    recursionLimit: 24
    maxRecursionLimit: 30
  custom:
    - name: "Qwen"
      apiKey: "${DASHSCOPE_API_KEY}"
      baseURL: "${QWEN_BASE_URL}"
      models:
        default: ["qwen-plus"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "Qwen (DashScope)"
      iconURL: "qwen"
    - name: "z.ai"
      apiKey: "${ZAI_API_KEY}"
      baseURL: "${ZAI_BASE_URL}"
      models:
        default: ["glm-4"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "z.ai (GLM)"
      iconURL: "/assets/providers/zai.svg"
    - name: "ZenMux"
      apiKey: "${ZENMUX_API_KEY}"
      baseURL: "${ZENMUX_BASE_URL}"
      models:
        default: ["glm-5.3-flash", "glm-5.2"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "ZenMux"
      iconURL: "/assets/providers/zenmux.svg"
    - name: "GMI Cloud"
      apiKey: "${GMI_API_KEY}"
      baseURL: "${GMI_BASE_URL}"
      models:
        default: ["default"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "GMI Cloud"
      iconURL: "/assets/providers/gmi.png"
    - name: "BAI"
      apiKey: "${BAI_API_KEY}"
      baseURL: "${BAI_BASE_URL}"
      models:
        default: ["glm-5.3-flash"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "BAI (b.ai)"
      iconURL: "/assets/providers/bai.png"
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "${GROQ_BASE_URL}"
      models:
        default: ["llama-3.3-70b-versatile"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "Groq"
      iconURL: "groq"
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "${OPENROUTER_BASE_URL}"
      models:
        default: ["meta-llama/llama-3.3-70b-instruct"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "OpenRouter"
      iconURL: "openrouter"
    # Each user brings their own OpenRouter key; LibreChat stores it encrypted per user
    # and the usage goes on that user's OpenRouter account.
    - name: "OpenRouter (own key)"
      apiKey: "user_provided"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["anthropic/claude-sonnet-5.5", "google/gemini-3.8-flash", "openai/gpt-6-luna"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "OpenRouter"
      iconURL: "openrouter"
    # Featherless: pay per token from our credit. Its catalogue is huge, so models are
    # listed by hand: only families with native tool calls (Qwen 3, Kimi K2), 262k context.
    - name: "Featherless"
      apiKey: "${FEATHERLESS_API_KEY}"
      baseURL: "https://api.featherless.ai/v1"
      headers:
        HTTP-Referer: "https://omicsbase.utu.fi"
        X-Title: "OmicsBase"
      models:
        default: ["Qwen/Qwen3.8-Flash-Next", "Qwen/Qwen3.8-27B", "Qwen/Qwen3.5-397B-A17B", "moonshotai/Kimi-K2.6", "moonshotai/Kimi-K2.7-Code"]
        fetch: false
      titleConvo: true
      modelDisplayLabel: "Featherless"
      iconURL: "huggingface"
    - name: "OpenCode"
      apiKey: "${OPENCODE_API_KEY}"
      baseURL: "${OPENCODE_BASE_URL}"
      models:
        default: ["space-bunny-free"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "OpenCode"
      iconURL: "/assets/providers/opencode.svg"
    - name: "APMIX"
      apiKey: "${APMIX_API_KEY}"
      baseURL: "${APMIX_BASE_URL}"
      models:
        default: ["deepseek-v4-flash-free", "space-bunny-free"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "APMIX"
      iconURL: "/assets/providers/apmix.ico"
    - name: "APMIX-Anthropic"
      provider: "anthropic"
      apiKey: "${APMIX_API_KEY}"
      baseURL: "${APMIX_ANTHROPIC_BASE_URL}"
      headers:
        anthropic-version: "2023-06-01"
      models:
        default:
          - "deepseek-v4-flash-free"
          - "space-bunny-free"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "APMIX (Anthropic)"
      iconURL: "anthropic"

modelSpecs:
  enforce: false
  prioritize: true
  list:
    # --- Recording Models (Highest Reliability) ---
    - name: "gemini-3.8-flash"
      label: "Gemini 3.8 Flash"
      description: "Next-gen Google multimodal reasoning model"
      default: true
      preset:
        endpoint: "google"
        model: "gemini-3.8-flash"
      mcpServers:
        - "notethreads"

    - name: "gpt-6-luna"
      label: "GPT-6 Luna"
      iconURL: "openai"
      description: "Fast, low-cost and follows instructions closely"
      preset:
        endpoint: "OpenRouter"
        model: "openai/gpt-6-luna"
      mcpServers:
        - "notethreads"

    - name: "gemini-4-argon"
      label: "Gemini 4 Argon"
      iconURL: "google"
      description: "Google's newest and strongest model for complex analyses"
      preset:
        endpoint: "google"
        model: "gemini-4-argon"
      mcpServers:
        - "notethreads"

    - name: "gemini-3.1-pro"
      label: "Gemini 3.1 Pro"
      iconURL: "google"
      description: "Google's Pro model, faster than Argon"
      preset:
        endpoint: "google"
        model: "gemini-3.1-pro-preview"
      mcpServers:
        - "notethreads"

    - name: "claude-sonnet-4-6-free"
      label: "Claude Sonnet 4.6 (Free)"
      description: "Anthropic's Sonnet 4.6 on APMIX's free tier; limits may apply"
      iconURL: "anthropic"
      preset:
        endpoint: "APMIX"
        model: "claude-sonnet-4-6-free"
      mcpServers:
        - "notethreads"

    - name: "glm-5.2"
      label: "GLM-5.2 (ZenMux)"
      iconURL: "/assets/providers/zai.svg"
      description: "High-capability reasoning and coding model via ZenMux"
      preset:
        endpoint: "ZenMux"
        model: "glm-5.2"
      mcpServers:
        - "notethreads"

    - name: "gemini-3.7-flash"
      label: "Gemini 3.7 Flash"
      description: "High-speed hybrid reasoning model"
      preset:
        endpoint: "google"
        model: "gemini-3.7-flash"
      mcpServers:
        - "notethreads"

    # --- Fast / Free Models ---
    - name: "apmix-deepseek-flash"
      label: "DeepSeek V4 Flash (APMIX Free)"
      iconURL: "deepseek"
      description: "High-speed reasoning model with 1M context via APMIX"
      preset:
        endpoint: "APMIX"
        model: "deepseek-v4-flash-free"
      mcpServers:
        - "notethreads"

    - name: "space-bunny"
      label: "Space Bunny (Free)"
      iconURL: "openrouter"
      description: "Fast multimodal reasoning with 1M context via OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "stealth/space-bunny-alpha"
      mcpServers:
        - "notethreads"

    - name: "opencode-space-bunny"
      label: "Space Bunny (OpenCode)"
      iconURL: "/assets/providers/opencode.svg"
      description: "Fast reasoning model via OpenCode Zen API"
      preset:
        endpoint: "OpenCode"
        model: "space-bunny-free"
      mcpServers:
        - "notethreads"

    - name: "apmix-space-bunny"
      label: "Space Bunny (APMIX Free)"
      iconURL: "/assets/providers/apmix.ico"
      description: "Multimodal reasoning with 1M context via APMIX"
      preset:
        endpoint: "APMIX"
        model: "space-bunny-free"
      mcpServers:
        - "notethreads"

    - name: "nex-mini-free"
      label: "Nex AGI Mini (Free)"
      iconURL: "openrouter"
      description: "Fast compact reasoning model via OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "nex-agi/nex-n2.5-mini:free"
      mcpServers:
        - "notethreads"

    - name: "cohere-code-free"
      label: "Cohere Code (Free)"
      iconURL: "cohere"
      description: "Code generation and scripting model via OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "cohere/north-mini-code:free"
      mcpServers:
        - "notethreads"

    - name: "byok-claude-sonnet-5-5"
      label: "Claude Sonnet 5.5 (your OpenRouter key)"
      iconURL: "anthropic"
      description: "Strongest analysis model; billed to your own OpenRouter account"
      preset:
        endpoint: "OpenRouter (own key)"
        model: "anthropic/claude-sonnet-5.5"
      mcpServers:
        - "notethreads"

    - name: "byok-gemini-3-8-flash"
      label: "Gemini 3.8 Flash (your OpenRouter key)"
      iconURL: "google"
      description: "Fast and capable; billed to your own OpenRouter account"
      preset:
        endpoint: "OpenRouter (own key)"
        model: "google/gemini-3.8-flash"
      mcpServers:
        - "notethreads"

    - name: "byok-gpt-6-luna"
      label: "GPT-6 Luna (your OpenRouter key)"
      iconURL: "openai"
      description: "Very low cost; billed to your own OpenRouter account"
      preset:
        endpoint: "OpenRouter (own key)"
        model: "openai/gpt-6-luna"
      mcpServers:
        - "notethreads"

    - name: "featherless-qwen3-8-flash-next"
      label: "Qwen 3.8 Flash Next (Featherless)"
      iconURL: "/assets/qwen.svg"
      description: "Fast and very low cost"
      preset:
        endpoint: "Featherless"
        model: "Qwen/Qwen3.8-Flash-Next"
      mcpServers:
        - "notethreads"

    - name: "featherless-qwen3-8-27b"
      label: "Qwen 3.8 27B (Featherless)"
      iconURL: "/assets/qwen.svg"
      description: "Compact, quick everyday model"
      preset:
        endpoint: "Featherless"
        model: "Qwen/Qwen3.8-27B"
      mcpServers:
        - "notethreads"

    - name: "featherless-qwen3-5-397b"
      label: "Qwen 3.5 397B (Featherless)"
      iconURL: "/assets/qwen.svg"
      description: "Large Qwen model for harder analyses"
      preset:
        endpoint: "Featherless"
        model: "Qwen/Qwen3.5-397B-A17B"
      mcpServers:
        - "notethreads"

    - name: "featherless-kimi-k2-6"
      label: "Kimi K2.6 (Featherless)"
      iconURL: "moonshot"
      description: "Strong at multi-step tool use"
      preset:
        endpoint: "Featherless"
        model: "moonshotai/Kimi-K2.6"
      mcpServers:
        - "notethreads"

    - name: "featherless-kimi-k2-7-code"
      label: "Kimi K2.7 Code (Featherless)"
      iconURL: "moonshot"
      description: "Tuned for writing and fixing code"
      preset:
        endpoint: "Featherless"
        model: "moonshotai/Kimi-K2.7-Code"
      mcpServers:
        - "notethreads"
