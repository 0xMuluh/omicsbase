# OmicsBase engine on LUMI-K: one engine pod, a shared (CephFS) volume for note
# folders and caches, and a TLS route that only the OmicsBase VM can reach. The image
# is the Rahti one (deployment/rahti/Dockerfile), which already runs as LUMI-K's
# random non-root user. The engine secret is created separately:
#   oc create secret generic omicsbase-engine --from-file=OMICSBASE_AUTH_SECRET=<file>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omicsbase-engine-data
spec:
  # ReadWriteMany, so per-note containers can later open any note's workspace.
  accessModes: [ReadWriteMany]
  storageClassName: rook-ceph-fs
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omicsbase-engine
  labels:
    app: omicsbase-engine
spec:
  replicas: 1
  # R sessions live in the pod; never run two engines on one volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omicsbase-engine
  template:
    metadata:
      labels:
        app: omicsbase-engine
    spec:
      # Time for every live R session to save its workspace before the pod is killed.
      terminationGracePeriodSeconds: 150
      containers:
        - name: engine
          # One tag per build: nodes keep a tag they already have, so a reused tag
          # would keep running the old code.
          image: registry.apps.v1.lumi-k.eu/omicsbase-utu/omicsbase-engine:lumik-09b1c04
          command: ["python3", "-m", "engine.server"]
          ports:
            - containerPort: 8001
          env:
            - name: OMICSBASE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: omicsbase-engine
                  key: OMICSBASE_AUTH_SECRET
            - name: BASE_URL
              value: https://omicsbase-engine-omicsbase-utu.apps.lumi-k.eu
            - name: DOMAIN_CLIENT
              value: https://omicsbase.utu.fi
            - name: LIBRECHAT_INTERNAL_URL
              value: https://omicsbase.utu.fi
            # A 16 GiB limit (LUMI-K's per-container maximum) holds about four live
            # R sessions with data loaded.
            - name: NOTE_MAX_SESSIONS
              value: "4"
          # LUMI-K allows at most 8 cores and 16 GiB per container, and a limit at most
          # 5 times the request.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omicsbase-engine-data
---
apiVersion: v1
kind: Service
metadata:
  name: omicsbase-engine
spec:
  selector:
    app: omicsbase-engine
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: omicsbase-engine
  annotations:
    # Only the OmicsBase VM may call the engine.
    haproxy.router.openshift.io/ip_whitelist: 128.214.252.225
    haproxy.router.openshift.io/timeout: 700s
spec:
  host: omicsbase-engine-omicsbase-utu.apps.lumi-k.eu
  to:
    kind: Service
    name: omicsbase-engine
  port:
    targetPort: 8001
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
