services:
  api:
    image: ${OMICSBASE_LIBRECHAT_IMAGE:-omicsbase-librechat:d86005881}
    pull_policy: never
    ports: !override
      - "127.0.0.1:3080:3080"
    environment:
      - OMICSBASE_AUTH_SECRET=${OMICSBASE_AUTH_SECRET:?OMICSBASE_AUTH_SECRET must be set}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - OMICSBASE_OPENHANDS_PUBLIC_URL=${OMICSBASE_OPENHANDS_PUBLIC_URL:-http://localhost:3001}
      - OMICSBASE_OPENHANDS_INTERNAL_URL=http://openhands:8000
      - NOTEKERNEL_URL=http://engine:8001
      - PROJECTS_DIR=/app/projects
    volumes:
      - ./api/server/controllers/auth/LogoutController.js:/app/api/server/controllers/auth/LogoutController.js:ro
      - ./api/server/routes/projects.js:/app/api/server/routes/projects.js:ro
      - ./api/server/routes/notes.js:/app/api/server/routes/notes.js:ro
      - ./api/server/routes/index.js:/app/api/server/routes/index.js:ro
      - ./api/server/index.js:/app/api/server/index.js:ro
      - ./api/server/experimental.js:/app/api/server/experimental.js:ro
      - ./api/server/services/Files/process.js:/app/api/server/services/Files/process.js:ro
      - ./api/server/services/NoteCells:/app/api/server/services/NoteCells:ro
      - ../projects:/app/projects:rw
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
    depends_on:
      - engine

  engine:
    image: ${OMICSBASE_ENGINE_IMAGE:-omicsbase-engine:dev}
    container_name: omicsbase-engine
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PROJECTS_DIR=/app/projects
      - BASE_URL=${OMICSBASE_ENGINE_PUBLIC_URL:-http://localhost:8001}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - OMICSBASE_AUTH_SECRET=${OMICSBASE_AUTH_SECRET:?OMICSBASE_AUTH_SECRET must be set}
      - LIBRECHAT_INTERNAL_URL=http://api:3080
    volumes:
      - ../engine:/app/engine
      - ../projects:/app/projects
    command: ["python3", "-m", "engine.server"]

  openhands:
    image: ${OMICSBASE_OPENHANDS_IMAGE:-omicsbase-openhands:dev}
    container_name: openhands-engine
    restart: always
    ports:
      - "127.0.0.1:3001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AGENT_CANVAS_BASE_PATH=/
      - OMICSBASE_AUTH_SECRET=${OMICSBASE_AUTH_SECRET:?OMICSBASE_AUTH_SECRET must be set}
      - OMICSBASE_OPENHANDS_PUBLIC_URL=${OMICSBASE_OPENHANDS_PUBLIC_URL:-http://localhost:3001}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - LLM_MODEL=${LLM_MODEL:-openai/glm-5.3-flash}
      - LLM_BASE_URL=${BAI_BASE_URL:-https://api.b.ai/v1}
      - LLM_API_KEY=${BAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_KEY=${GOOGLE_KEY}
      - GEMINI_API_KEY=${GOOGLE_KEY}
      - GOOGLE_API_KEY=${GOOGLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_KEY=${OPENROUTER_KEY}
    volumes:
      - ../projects:/projects:rw
      - ${OPENHANDS_STATE_DIR:-${HOME}/.openhands}:/home/openhands/.openhands
      - ../docker/openhands/gateway:/opt/agent-canvas/gateway:ro



  admin-panel:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_SSO_ENABLED: "${ADMIN_SSO_ENABLED:-true}"
