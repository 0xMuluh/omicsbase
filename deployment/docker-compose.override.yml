services:
  api:
    image: ${OMICSBASE_LIBRECHAT_IMAGE:-omicsbase-librechat:d86005881}
    pull_policy: never
    ports: !override
      - "127.0.0.1:3080:3080"
    environment:
      - OMICSBASE_AUTH_SECRET=${OMICSBASE_AUTH_SECRET:?OMICSBASE_AUTH_SECRET must be set}
      - OMICSBASE_ENGINE_SECRET=${OMICSBASE_ENGINE_SECRET:-}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - OMICSBASE_OPENHANDS_PUBLIC_URL=${OMICSBASE_OPENHANDS_PUBLIC_URL:-http://localhost:3001}
      # Where notes run: the VM engine (default) or LUMI-K (deployment/lumi-k/engine.yaml).
      - NOTEKERNEL_URL=${OMICSBASE_ENGINE_URL:-http://engine:8001}
      - PROJECTS_DIR=/app/projects
      # Reports on Roihu (deployment/roihu): the router's private interface on the Docker
      # network, the image release, and the relay users' jobs connect to. The router secret
      # and relay fingerprint come from .env; without them the Reports page says it is not set up.
      - ROIHU_ROUTER_URL=${ROIHU_ROUTER_URL:-http://172.18.0.1:18096}
      - ROIHU_ROUTER_SECRET=${ROIHU_ROUTER_SECRET:-}
      - ROIHU_IMAGE_TAG=${ROIHU_IMAGE_TAG:-v1.41.0-roihu6}
      - ROIHU_RELAY_URL=${OMICSBASE_OPENHANDS_PUBLIC_URL:-http://localhost:3001}
      - ROIHU_RELAY_FINGERPRINT=${ROIHU_RELAY_FINGERPRINT:-}
      - ROIHU_SCRIPTS_DIR=/app/roihu
    volumes:
      - ./api/server/controllers/auth/LogoutController.js:/app/api/server/controllers/auth/LogoutController.js:ro
      - ./api/server/routes/projects.js:/app/api/server/routes/projects.js:ro
      - ./api/server/routes/notes.js:/app/api/server/routes/notes.js:ro
      - ./api/server/middleware/uaParser.js:/app/api/server/middleware/uaParser.js:ro
      - ./api/server/routes/index.js:/app/api/server/routes/index.js:ro
      - ./api/server/routes/roihu.js:/app/api/server/routes/roihu.js:ro
      - ../deployment/roihu:/app/roihu:ro
      - ./api/server/index.js:/app/api/server/index.js:ro
      - ./api/server/middleware/publicPageMeta.js:/app/api/server/middleware/publicPageMeta.js:ro
      - ./api/server/experimental.js:/app/api/server/experimental.js:ro
      - ./api/server/services/Files/process.js:/app/api/server/services/Files/process.js:ro
      - ./api/server/services/NoteCells:/app/api/server/services/NoteCells:ro
      - ../projects:/app/projects:rw
      - ../certs:/app/certs:ro
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./client/public/assets/favicon.svg:/app/client/dist/assets/favicon.svg:ro
      - ./client/public/assets/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png:ro
      - ./client/public/assets/favicon-light-32x32.png:/app/client/dist/assets/favicon-light-32x32.png:ro
      - ./client/public/assets/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png:ro
      - ./client/public/assets/favicon-light-16x16.png:/app/client/dist/assets/favicon-light-16x16.png:ro
      - ./client/public/assets/apple-touch-icon-180x180.png:/app/client/dist/assets/apple-touch-icon-180x180.png:ro
      - ./client/public/assets/logo.svg:/app/client/dist/assets/logo.svg:ro
      - ./client/public/assets/logo-dark.png:/app/client/dist/assets/logo-dark.png:ro
      - ./client/public/assets/logo-light.png:/app/client/dist/assets/logo-light.png:ro
      - ./client/public/favicon.ico:/app/client/dist/favicon.ico:ro
    depends_on:
      - engine

  engine:
    image: ${OMICSBASE_ENGINE_IMAGE:-omicsbase-engine:dev}
    container_name: omicsbase-engine
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PROJECTS_DIR=/app/projects
      - BASE_URL=${OMICSBASE_ENGINE_PUBLIC_URL:-http://localhost:8001}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - OMICSBASE_AUTH_SECRET=${OMICSBASE_AUTH_SECRET:?OMICSBASE_AUTH_SECRET must be set}
      - OMICSBASE_ENGINE_SECRET=${OMICSBASE_ENGINE_SECRET:-}
      - EXPERIMENT_HUB_CACHE=/app/cache/ExperimentHub
      - ANNOTATION_HUB_CACHE=/app/cache/AnnotationHub
      - RETICULATE_PYTHON=/usr/bin/python3
    volumes:
      - ../engine:/app/engine
      - ../projects:/app/projects
      - engine-cache:/app/cache
    command: ["python3", "-m", "engine.server"]

  admin-panel:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_SSO_ENABLED: "${ADMIN_SSO_ENABLED:-true}"

volumes:
  engine-cache:

