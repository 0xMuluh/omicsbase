project:
  type: website
  output-dir: ../output
  render:
    - study_overview.qmd
    - analysis_plan.qmd
    - data_summary.qmd
    - primary_results.qmd
    - covariate_diagnostics.qmd

website:
  title: "Analysis report"
  navbar:
    left:
      - text: "Study overview"
        file: study_overview.qmd
      - text: "Analysis plan"
        file: analysis_plan.qmd
      - text: "Data summary"
        file: data_summary.qmd
      - text: "Primary results"
        file: primary_results.qmd
      - text: "Covariate diagnostics"
        file: covariate_diagnostics.qmd

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Show code"
    theme: cosmo
    page-layout: full
    fig-width: 10
    fig-height: 7
    fig-dpi: 300

execute:
  echo: true
  warning: false
  message: false
