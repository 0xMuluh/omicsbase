services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omicsbase
      POSTGRES_PASSWORD: omicsbase
      POSTGRES_DB: omicsbase
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  opencode:
    image: omicsbase-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c 'if [ -n "$$GEMINI_API_KEY" ] && [ -z "$$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
      export GOOGLE_GENERATIVE_AI_API_KEY="$$GEMINI_API_KEY"; fi;
      exec opencode serve --hostname 0.0.0.0 --port 4096'
    env_file:
      - .env
    environment:
      PROJECTS_DIR: /app/projects
      DEV_MODE: "true"
      OPENCODE_BIN: /usr/local/bin/opencode
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "4096:4096"
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/app:/app/app
      - ./prompts:/app/prompts
      - ./registry:/app/registry
      - ./templates:/app/templates
      - /home/simple/.opencode/bin/opencode:/usr/local/bin/opencode:ro

  backend:
    image: omicsbase-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://omicsbase:omicsbase@postgres:5432/omicsbase
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      PROJECTS_DIR: /app/projects
      DEV_MODE: "true"
      USE_DOCKER_SANDBOX: "false"
      AGENT_MAX_STEPS: "10"
      OPENCODE_BIN: /usr/local/bin/opencode
      OPENCODE_SERVER_URL: http://opencode:4096
      OPENCODE_SERVER_AUTOSTART: "false"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./prompts:/app/prompts
      - ./registry:/app/registry
      - ./templates:/app/templates
      - ./backend/knowledge:/app/knowledge
      - /home/simple/.opencode/bin/opencode:/usr/local/bin/opencode:ro
    depends_on:
      - postgres
      - redis
      - opencode

  worker:
    image: omicsbase-backend:dev
    command: celery -A app.tasks.analysis worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://omicsbase:omicsbase@postgres:5432/omicsbase
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      PROJECTS_DIR: /app/projects
      DEV_MODE: "true"
      USE_DOCKER_SANDBOX: "false"
      AGENT_MAX_STEPS: "10"
      OPENCODE_BIN: /usr/local/bin/opencode
      OPENCODE_SERVER_URL: http://opencode:4096
      OPENCODE_SERVER_AUTOSTART: "false"
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/app:/app/app
      - ./prompts:/app/prompts
      - ./registry:/app/registry
      - ./templates:/app/templates
      - ./backend/knowledge:/app/knowledge
      - /home/simple/.opencode/bin/opencode:/usr/local/bin/opencode:ro
    depends_on:
      - postgres
      - redis
      - opencode

  beat:
    image: omicsbase-backend:dev
    command: celery -A app.tasks.analysis beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://omicsbase:omicsbase@postgres:5432/omicsbase
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      PROJECTS_DIR: /app/projects
      DEV_MODE: "true"
      USE_DOCKER_SANDBOX: "false"
      AGENT_MAX_STEPS: "10"
    volumes:
      - ./backend/app:/app/app
      - ./backend/knowledge:/app/knowledge
      - ./prompts:/app/prompts
      - ./registry:/app/registry
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
