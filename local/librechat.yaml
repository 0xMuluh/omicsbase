# OmicsBase on one machine. Each user enters their own model key in the browser (stored
# encrypted per user), or uses a model already running in Ollama on this machine.
version: 1.2.0

cache: true

interface:
  appTitle: "OmicsBase"
  modelSelect: true

fileConfig:
  endpoints:
    default:
      supportedMimeTypes: &dataFiles
        - "image/.*"
        - "text/.*"
        - "application/pdf"
        - "application/json"
        - "application/xml"
        - "application/zip"
        - "application/x-zip-compressed"
        - "application/x-tar"
        - "application/gzip"
        - "application/x-gzip"
        - "application/x-r-rds"
        - "application/x-parquet"
        - "application/vnd.apache.parquet"
        - "application/x-hdf"
        - "application/x-hdf5"
        - "application/octet-stream"
    custom:
      supportedMimeTypes: *dataFiles

# The engine on this machine has a private address; allow just its port. An engine on
# another machine (ENGINE_URL in .env) is reached at its public HTTPS address.
mcpSettings:
  allowedAddresses:
    - 'engine:8001'

# The notes tools (R cells, packages, files). Every note selects them.
mcpServers:
  notethreads:
    type: sse
    url: ${ENGINE_URL}/sse
    headers:
      X-Internal-Secret: ${OMICSBASE_ENGINE_SECRET}
    # The engine is authenticated by the header above, not OAuth; without this, LibreChat
    # probes it without the header, takes the 401 for OAuth and loads no tools.
    requiresOAuth: false
    timeout: 660000
    serverInstructions: true

endpoints:
  # Ollama on this machine is a private address; allow just its port.
  allowedAddresses:
    - 'host.docker.internal:11434'
  agents:
    # Each tool call uses two graph steps; 40 allows about 19 calls per turn.
    recursionLimit: 40
    maxRecursionLimit: 50
  custom:
    - name: "OpenRouter"
      apiKey: "user_provided"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["openai/gpt-6-luna"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "OpenRouter"
      iconURL: "openrouter"
    # Models already pulled in Ollama (https://ollama.com) show up here. Notes need a
    # model that supports tool calls.
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1"
      models:
        default: ["qwen3"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "Ollama"
      iconURL: "ollama"
