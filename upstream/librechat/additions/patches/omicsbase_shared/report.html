<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmicsBase Report</title>
  <link rel="stylesheet" href="/api/omicsbase/assets/report.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="header-brand" title="OmicsBase Report">
          <span class="header-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </span>
          <span id="project-title" class="header-title">Analysis Pipeline</span>
        </div>
      </div>

      <!-- Icon-First Mode Switcher with Tooltip Hovers -->
      <div class="mode-switcher" role="tablist">
        <button id="tab-dashboard" class="mode-btn active" role="tab" aria-selected="true" title="Report Blueprint & Outputs">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
        <button id="tab-site" class="mode-btn" role="tab" aria-selected="false" title="Full Compiled Quarto Book">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        </button>
      </div>

      <div class="header-right">
        <span id="pipeline-status-badge" class="badge badge-generating" title="Pipeline execution status">
          <span class="badge-dot badge-pulse"></span>
          <span id="pipeline-status-text">Active</span>
        </span>
        <button id="open-new-tab-btn" class="btn btn-icon" title="Open in new window">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
        <button id="refresh-btn" class="btn btn-icon" title="Check for newly written outputs">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>
    </header>

    <div class="content-area">
      <!-- Report Surface -->
      <div id="dashboard-view">
        <!-- Section 1: Chapters & Pipeline Scripts (Option A Pill Switcher) -->
        <div>
          <div class="section-title-row">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div class="section-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <span>Pipeline</span>
              </div>
              <div id="section-pills" class="section-pills" role="tablist">
                <button id="pill-chapters" class="section-pill-btn active" role="tab" aria-selected="true" title="View Quarto Report Chapters">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                  <span>Chapters</span>
                  <span id="pill-count-chapters" class="pill-count">0</span>
                </button>
                <button id="pill-scripts" class="section-pill-btn" role="tab" aria-selected="false" title="View R Pipeline Scripts">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                  <span>Scripts</span>
                  <span id="pill-count-scripts" class="pill-count">0</span>
                </button>
              </div>
            </div>
            <span id="stages-section-meta" class="section-meta"></span>
          </div>
          <div id="chapters-grid" class="chapters-grid"></div>
          <div id="scripts-grid" class="chapters-grid" style="display:none;"></div>
        </div>

        <!-- Section 2: Figures -->
        <div>
          <div class="section-title-row">
            <div class="section-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span id="figures-section-title">Figures</span>
              <span id="figures-section-count" class="section-count"></span>
            </div>
            <span id="figures-count-meta" class="section-meta"></span>
          </div>
          <div id="figures-grid" class="figures-grid"></div>
        </div>
      </div>

      <!-- Full Quarto Book View -->
      <div id="site-view">
        <iframe id="site-iframe" src="" title="Full Quarto Report"></iframe>
      </div>
    </div>
  </div>

  <!-- Modal for Chapter, Figure, or Script preview -->
  <div id="preview-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <span id="modal-title" class="modal-title">Preview</span>
        <div class="modal-header-actions">
          <button id="modal-copy-btn" class="btn" style="display:none; height:24px; padding:0 8px; font-size:11px; gap:4px;" title="Copy script code">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span id="modal-copy-text">Copy</span>
          </button>
          <button id="modal-close-btn" class="modal-close" title="Close">×</button>
        </div>
      </div>
      <div id="modal-body" class="modal-body">
        <iframe id="modal-iframe" src="" title="Chapter Preview"></iframe>
        <div id="modal-img-container" class="modal-img-container" style="display:none;">
          <img id="modal-img" src="" alt="Full Resolution Figure">
        </div>
        <div id="modal-code-container" class="modal-code-container" style="display:none;">
          <div class="code-viewer-layout">
            <pre id="modal-gutter" class="code-gutter" aria-hidden="true"></pre>
            <pre class="code-body"><code id="modal-code" class="language-r"></code></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Vendored Prism.js Core + R + Python + Bash Grammars -->
  <script src="/api/omicsbase/assets/report-prism.js"></script>

  <script src="/api/omicsbase/assets/report.js"></script>
</body>
</html>
