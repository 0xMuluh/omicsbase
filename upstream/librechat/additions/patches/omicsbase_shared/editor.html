<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmicsBase Editor</title>
  <style>
    :root {
      --bg-base: #0d0f11;
      --bg-surface: #14171a;
      --bg-elevated: #1a1d21;
      --bg-hover: #22262b;
      --bg-active: #2a2f35;
      --border: #26292e;
      --border-light: #33383f;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #0ea5e9;
      --accent-hover: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-base); color: var(--text-primary);
      font-family: var(--font-sans); font-size: 13px;
    }

    #app {
      display: flex; flex-direction: column; width: 100%; height: 100%;
    }

    /* Top Bar */
    header {
      height: 38px; min-height: 38px; background: var(--bg-surface);
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-between; padding: 0 12px; gap: 8px; z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .header-title {
      font-weight: 600; font-size: 12px; color: var(--text-secondary);
      display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .file-breadcrumb {
      color: var(--text-primary); font-family: var(--font-mono); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;
    }

    .header-right { display: flex; align-items: center; gap: 6px; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 9999px; font-size: 11px; font-weight: 500;
    }
    .badge-saved { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge-unsaved { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .badge-saving { background: rgba(14, 165, 233, 0.15); color: var(--accent); }

    .btn {
      background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
    .btn-primary {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-icon { padding: 4px 6px; }

    /* Layout */
    .workspace {
      display: flex; flex: 1; min-height: 0; width: 100%; position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 230px; min-width: 160px; max-width: 400px; background: var(--bg-surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      flex-shrink: 0; user-select: none;
    }
    .sidebar-header {
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .sidebar-title-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .sidebar-actions { display: flex; align-items: center; gap: 3px; }
    .search-box {
      position: relative; width: 100%; display: flex; align-items: center;
    }
    .search-icon {
      position: absolute; left: 8px; color: var(--text-muted); pointer-events: none;
    }
    .search-input {
      width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-primary); padding: 4px 22px 4px 25px; border-radius: 5px; font-size: 12px;
      outline: none; transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-clear-btn {
      position: absolute; right: 6px; background: transparent; border: none;
      color: var(--text-muted); font-size: 14px; cursor: pointer; display: none; line-height: 1;
      padding: 2px 4px; border-radius: 3px;
    }
    .search-clear-btn:hover { color: var(--text-primary); background: var(--bg-hover); }

    .tree-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 0;
    }
    .tree-scroll::-webkit-scrollbar { width: 6px; }
    .tree-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .tree-item {
      display: flex; align-items: center; gap: 6px; padding: 4px 8px;
      cursor: pointer; border-radius: 4px; margin: 1px 4px; font-size: 12.5px;
      color: var(--text-secondary); transition: background 0.1s, color 0.1s;
    }
    .tree-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .tree-item.active {
      background: rgba(14, 165, 233, 0.15); color: var(--accent); font-weight: 500;
    }

    .folder-toggle {
      width: 12px; height: 12px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; color: var(--text-muted); flex-shrink: 0;
    }
    .tree-icon {
      font-size: 11px; font-weight: 600; padding: 1px 3px; border-radius: 3px; flex-shrink: 0;
      font-family: var(--font-mono); line-height: 1;
    }
    .icon-qmd { background: #0284c7; color: #fff; }
    .icon-r { background: #0d9488; color: #fff; }
    .icon-py { background: #eab308; color: #000; }
    .icon-data { background: #16a34a; color: #fff; }
    .icon-img { background: #9333ea; color: #fff; }
    .icon-cfg { background: #4b5563; color: #fff; }
    .icon-web { background: #ea580c; color: #fff; }
    .icon-file { color: var(--text-muted); }
    .icon-folder { color: #facc15; }

    .tree-name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }

    /* Main Area */
    .main-area {
      display: flex; flex-direction: column; flex: 1; min-width: 0; background: var(--bg-base);
    }

    /* Tabs */
    .tabs-bar {
      height: 34px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; overflow-x: auto; overflow-y: hidden;
      user-select: none;
    }
    .tabs-bar::-webkit-scrollbar { height: 3px; }
    .tabs-bar::-webkit-scrollbar-thumb { background: var(--border); }

    .tab {
      height: 100%; display: flex; align-items: center; gap: 6px; padding: 0 12px;
      border-right: 1px solid var(--border); background: var(--bg-surface);
      color: var(--text-secondary); cursor: pointer; font-size: 12px;
      white-space: nowrap; transition: background 0.1s; position: relative;
    }
    .tab:hover { background: var(--bg-hover); color: var(--text-primary); }
    .tab.active {
      background: var(--bg-base); color: var(--text-primary); font-weight: 500;
      border-top: 2px solid var(--accent);
    }
    .tab-dirty {
      width: 6px; height: 6px; border-radius: 50%; background: var(--warning); display: inline-block;
    }
    .tab-close {
      width: 14px; height: 14px; border-radius: 3px; display: inline-flex;
      align-items: center; justify-content: center; font-size: 12px; color: var(--text-muted);
      margin-left: 4px; line-height: 1;
    }
    .tab-close:hover { background: var(--bg-hover); color: var(--danger); }

    /* Content Area */
    .editor-container {
      flex: 1; width: 100%; height: calc(100% - 34px); position: relative;
    }
    #monaco-root {
      width: 100%; height: 100%; display: block;
    }

    #image-viewer {
      display: none; width: 100%; height: 100%; align-items: center; justify-content: center;
      background: #08090a; padding: 20px; overflow: auto;
    }
    #image-viewer img {
      max-width: 95%; max-height: 95%; object-fit: contain;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-radius: 6px;
    }

    #table-viewer {
      display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden;
      background: var(--bg-base);
    }
    .table-toolbar {
      padding: 6px 12px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; font-size: 11px;
    }
    .table-scroll {
      flex: 1; overflow: auto;
    }
    table.data-table {
      border-collapse: collapse; width: 100%; font-size: 12px; font-family: var(--font-mono);
    }
    table.data-table th, table.data-table td {
      border: 1px solid var(--border); padding: 5px 10px; text-align: left;
      white-space: nowrap;
    }
    table.data-table th {
      background: var(--bg-elevated); color: var(--text-secondary); position: sticky; top: 0;
    }
    table.data-table tr:hover { background: var(--bg-hover); }

    #empty-state {
      display: flex; flex-direction: column; width: 100%; height: 100%;
      align-items: center; justify-content: center; color: var(--text-muted); gap: 12px;
    }
    #empty-state svg { width: 48px; height: 48px; opacity: 0.4; }

    #fallback-textarea {
      display: none; width: 100%; height: 100%; background: var(--bg-base);
      color: var(--text-primary); font-family: var(--font-mono); font-size: 13px;
      padding: 12px; border: none; outline: none; resize: none; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="header-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span>WORKSPACE</span>
        </div>
        <span style="color: var(--border-light);">/</span>
        <span id="breadcrumb" class="file-breadcrumb">No file selected</span>
      </div>
      <div class="header-right">
        <span id="save-status" class="badge badge-saved">● Saved</span>
        <button id="save-btn" class="btn btn-primary" title="Save changes (Ctrl+S)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span>Save</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <!-- File Tree Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <span class="sidebar-title">Files</span>
            <div class="sidebar-actions">
              <button id="expand-all-btn" class="btn btn-icon" title="Expand all folders">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
              </button>
              <button id="collapse-all-btn" class="btn btn-icon" title="Collapse all folders">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 20 5-5 5 5"></path><path d="m7 4 5 5 5-5"></path></svg>
              </button>
              <button id="refresh-tree-btn" class="btn btn-icon" title="Refresh files">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              </button>
            </div>
          </div>
          <div class="search-box">
            <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="tree-search" type="text" class="search-input" placeholder="Search project files...">
            <button id="tree-search-clear" class="search-clear-btn" title="Clear search">×</button>
          </div>
        </div>
        <div id="tree-root" class="tree-scroll"></div>
      </aside>

      <!-- Main Editor Surface -->
      <main class="main-area">
        <div id="tabs-bar" class="tabs-bar"></div>
        <div class="editor-container">
          <div id="monaco-root"></div>
          <textarea id="fallback-textarea" spellcheck="false"></textarea>
          <div id="image-viewer">
            <img id="image-element" src="" alt="Image preview">
          </div>
          <div id="table-viewer">
            <div class="table-toolbar">
              <span id="table-info">Table Preview</span>
              <button id="table-toggle-source" class="btn btn-icon" title="Toggle raw source code">Edit Source</button>
            </div>
            <div id="table-content" class="table-scroll"></div>
          </div>
          <div id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
            <p>Select a file from the explorer to view or edit</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Monaco loader from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <script>
    (function() {
      const pathParts = window.location.pathname.split('/');
      const conversationId = pathParts[pathParts.indexOf('editor') + 1] || 'default';
      const API_BASE = `/api/omicsbase/editor/${conversationId}`;

      let monacoInstance = null;
      let editorInstance = null;
      let fileTreeData = [];
      let expandedFolders = new Set(['', 'R', 'data', 'results']);
      let openTabs = []; // [{ path, name, content, dirty: boolean, model }]
      let activeTabPath = null;
      let isSaving = false;

      // DOM elements
      const treeRoot = document.getElementById('tree-root');
      const treeSearch = document.getElementById('tree-search');
      const treeSearchClear = document.getElementById('tree-search-clear');
      const refreshBtn = document.getElementById('refresh-tree-btn');
      const expandAllBtn = document.getElementById('expand-all-btn');
      const collapseAllBtn = document.getElementById('collapse-all-btn');
      const tabsBar = document.getElementById('tabs-bar');
      const monacoRoot = document.getElementById('monaco-root');
      const fallbackTextarea = document.getElementById('fallback-textarea');
      const imageViewer = document.getElementById('image-viewer');
      const imageElement = document.getElementById('image-element');
      const tableViewer = document.getElementById('table-viewer');
      const tableContent = document.getElementById('table-content');
      const tableInfo = document.getElementById('table-info');
      const tableToggleSource = document.getElementById('table-toggle-source');
      const emptyState = document.getElementById('empty-state');
      const breadcrumb = document.getElementById('breadcrumb');
      const saveStatus = document.getElementById('save-status');
      const saveBtn = document.getElementById('save-btn');

      // Initialize Monaco
      if (typeof require !== 'undefined') {
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function(monaco) {
          monacoInstance = monaco;
          monaco.editor.defineTheme('omicsbase-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: 'comment', foreground: '6b7280', fontStyle: 'italic' },
              { token: 'keyword', foreground: '38bdf8' },
              { token: 'string', foreground: '34d399' },
              { token: 'number', foreground: 'f59e0b' },
              { token: 'type', foreground: '818cf8' },
            ],
            colors: {
              'editor.background': '#0d0f11',
              'editor.foreground': '#f3f4f6',
              'editor.lineHighlightBackground': '#14171a',
              'editorLineNumber.foreground': '#4b5563',
              'editorLineNumber.activeForeground': '#9ca3af',
              'editorIndentGuide.background': '#1f2428',
              'editorIndentGuide.activeBackground': '#374151',
              'editor.selectionBackground': 'rgba(14, 165, 233, 0.25)',
            }
          });

          editorInstance = monaco.editor.create(monacoRoot, {
            theme: 'omicsbase-dark',
            fontSize: 13,
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
            minimap: { enabled: false },
            scrollBeyondLastLine: false,
            automaticLayout: true,
            tabSize: 2,
            wordWrap: 'on',
            lineNumbers: 'on',
            folding: true,
            foldingHighlight: true,
            foldingStrategy: 'auto',
            showFoldingControls: 'always',
          });

          // Ctrl+S / Cmd+S save command
          editorInstance.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
            saveCurrentFile();
          });

          // Track edits
          editorInstance.onDidChangeModelContent(() => {
            if (!activeTabPath) return;
            const tab = openTabs.find(t => t.path === activeTabPath);
            if (tab && !tab.dirty) {
              tab.dirty = true;
              updateTabState(tab);
              updateSaveBadge(false);
            }
          });

          // If an active tab was loaded before monaco ready
          if (activeTabPath) {
            renderActiveFile();
          }
        });
      } else {
        fallbackTextarea.style.display = 'block';
        monacoRoot.style.display = 'none';
        fallbackTextarea.addEventListener('input', () => {
          if (!activeTabPath) return;
          const tab = openTabs.find(t => t.path === activeTabPath);
          if (tab && !tab.dirty) {
            tab.dirty = true;
            updateTabState(tab);
            updateSaveBadge(false);
          }
        });
      }

      function getLanguageForExt(ext) {
        switch (ext) {
          case 'qmd':
          case 'rmd':
          case 'md': return 'markdown';
          case 'r': return 'r';
          case 'py': return 'python';
          case 'json': return 'json';
          case 'yml':
          case 'yaml': return 'yaml';
          case 'css': return 'css';
          case 'js': return 'javascript';
          case 'ts': return 'typescript';
          case 'html': return 'html';
          case 'sh':
          case 'bash': return 'shell';
          case 'sql': return 'sql';
          case 'csv':
          case 'tsv': return 'plaintext';
          default: return 'plaintext';
        }
      }

      function getFileIcon(name, isDir) {
        if (isDir) return '<span class="tree-icon icon-folder">📁</span>';
        const ext = name.split('.').pop().toLowerCase();
        if (ext === 'qmd' || ext === 'rmd') return '<span class="tree-icon icon-qmd">Q</span>';
        if (ext === 'r') return '<span class="tree-icon icon-r">R</span>';
        if (ext === 'py') return '<span class="tree-icon icon-py">PY</span>';
        if (['csv', 'tsv', 'xlsx', 'parquet'].includes(ext)) return '<span class="tree-icon icon-data">DT</span>';
        if (['png', 'jpg', 'jpeg', 'svg', 'webp', 'gif'].includes(ext)) return '<span class="tree-icon icon-img">IMG</span>';
        if (['json', 'yml', 'yaml', 'toml', 'ini'].includes(ext)) return '<span class="tree-icon icon-cfg">{}</span>';
        if (['css', 'html', 'js', 'ts'].includes(ext)) return '<span class="tree-icon icon-web">&lt;&gt;</span>';
        return '<span class="tree-icon icon-file">📄</span>';
      }

      // Load Tree
      async function loadTree() {
        try {
          const res = await fetch(`${API_BASE}/tree`);
          if (!res.ok) throw new Error('Failed to load file tree');
          fileTreeData = await res.json();
          renderTree();
          // Auto open index.qmd or first qmd file if no tabs open
          if (openTabs.length === 0) {
            const firstFile = findFile(fileTreeData, f => f.name === 'index.qmd')
              || findFile(fileTreeData, f => f.name.endsWith('.qmd'))
              || findFile(fileTreeData, f => f.type === 'file');
            if (firstFile) {
              openFile(firstFile.path);
            }
          }
        } catch (e) {
          treeRoot.innerHTML = `<div style="padding: 12px; color: var(--danger);">Failed to load files</div>`;
        }
      }

      function findFile(nodes, predicate) {
        for (const node of nodes) {
          if (node.type === 'file' && predicate(node)) return node;
          if (node.type === 'directory' && node.children) {
            const found = findFile(node.children, predicate);
            if (found) return found;
          }
        }
        return null;
      }

      function expandAll() {
        function collect(nodes) {
          nodes.forEach(n => {
            if (n.type === 'directory') {
              expandedFolders.add(n.path);
              if (n.children) collect(n.children);
            }
          });
        }
        collect(fileTreeData);
        renderTree();
      }

      function collapseAll() {
        expandedFolders.clear();
        renderTree();
      }

      if (expandAllBtn) expandAllBtn.addEventListener('click', () => expandAll());
      if (collapseAllBtn) collapseAllBtn.addEventListener('click', () => collapseAll());

      function nodeMatchesOrHasChild(node, q) {
        if (node.name.toLowerCase().includes(q) || node.path.toLowerCase().includes(q)) return true;
        if (node.type === 'directory' && node.children) {
          return node.children.some(child => nodeMatchesOrHasChild(child, q));
        }
        return false;
      }

      function renderTree() {
        const query = treeSearch.value.trim().toLowerCase();
        treeRoot.innerHTML = '';

        function buildNode(node, depth) {
          if (query && !nodeMatchesOrHasChild(node, query)) {
            return null;
          }

          const isDir = node.type === 'directory';
          const isExpanded = query ? true : expandedFolders.has(node.path);

          const el = document.createElement('div');
          el.className = `tree-item ${activeTabPath === node.path ? 'active' : ''}`;
          el.style.paddingLeft = `${depth * 14 + 6}px`;

          const toggle = document.createElement('span');
          toggle.className = 'folder-toggle';
          toggle.textContent = isDir ? (isExpanded ? '▾' : '▸') : '';

          const icon = document.createElement('span');
          icon.innerHTML = getFileIcon(node.name, isDir);

          const label = document.createElement('span');
          label.className = 'tree-name';
          label.textContent = node.name;
          label.title = node.path;

          el.appendChild(toggle);
          el.appendChild(icon);
          el.appendChild(label);

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isDir) {
              if (isExpanded) expandedFolders.delete(node.path);
              else expandedFolders.add(node.path);
              renderTree();
            } else {
              openFile(node.path);
            }
          });

          const container = document.createElement('div');
          container.appendChild(el);

          if (isDir && isExpanded && node.children) {
            const childContainer = document.createElement('div');
            let hasVisibleChild = false;
            node.children.forEach(child => {
              const childEl = buildNode(child, depth + 1);
              if (childEl) {
                childContainer.appendChild(childEl);
                hasVisibleChild = true;
              }
            });
            if (hasVisibleChild || !query) {
              container.appendChild(childContainer);
            } else if (query && !hasVisibleChild) {
              return null;
            }
          }

          return container;
        }

        let renderedCount = 0;
        fileTreeData.forEach(node => {
          const nodeEl = buildNode(node, 0);
          if (nodeEl) {
            treeRoot.appendChild(nodeEl);
            renderedCount++;
          }
        });

        if (query && renderedCount === 0) {
          treeRoot.innerHTML = `<div style="padding: 16px 12px; color: var(--text-muted); font-size: 12px; text-align: center;">No files match "${escapeHtml(query)}"</div>`;
        }
      }

      treeSearch.addEventListener('input', () => {
        if (treeSearchClear) {
          treeSearchClear.style.display = treeSearch.value.trim() ? 'block' : 'none';
        }
        renderTree();
      });

      if (treeSearchClear) {
        treeSearchClear.addEventListener('click', () => {
          treeSearch.value = '';
          treeSearchClear.style.display = 'none';
          renderTree();
          treeSearch.focus();
        });
      }

      treeSearch.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          treeSearch.value = '';
          if (treeSearchClear) treeSearchClear.style.display = 'none';
          renderTree();
        }
      });

      refreshBtn.addEventListener('click', () => loadTree());

      // Open file
      async function openFile(filePath) {
        let tab = openTabs.find(t => t.path === filePath);
        if (!tab) {
          const ext = filePath.split('.').pop().toLowerCase();
          const isImg = ['png', 'jpg', 'jpeg', 'svg', 'webp', 'gif'].includes(ext);
          const isTable = ['csv', 'tsv'].includes(ext);

          updateSaveBadge('loading');
          try {
            const res = await fetch(`${API_BASE}/file?path=${encodeURIComponent(filePath)}`);
            if (!res.ok) throw new Error('Could not read file');

            let content = '';
            if (!isImg) {
              const data = await res.json();
              content = data.content || '';
            }

            tab = {
              path: filePath,
              name: filePath.split('/').pop(),
              content: content,
              dirty: false,
              ext: ext,
              isImg: isImg,
              isTable: isTable,
              viewMode: isTable ? 'table' : 'editor',
              model: null
            };

            if (monacoInstance && !isImg) {
              const lang = getLanguageForExt(ext);
              tab.model = monacoInstance.editor.createModel(content, lang);
            }

            openTabs.push(tab);
          } catch (err) {
            alert(`Failed to open ${filePath}: ${err.message}`);
            updateSaveBadge(true);
            return;
          }
        }

        activeTabPath = filePath;
        renderTabs();
        renderActiveFile();
        renderTree();
      }

      function renderTabs() {
        tabsBar.innerHTML = '';
        openTabs.forEach(tab => {
          const el = document.createElement('div');
          el.className = `tab ${tab.path === activeTabPath ? 'active' : ''}`;
          
          const icon = document.createElement('span');
          icon.innerHTML = getFileIcon(tab.name, false);

          const name = document.createElement('span');
          name.textContent = tab.name;

          el.appendChild(icon);
          el.appendChild(name);

          if (tab.dirty) {
            const dot = document.createElement('span');
            dot.className = 'tab-dirty';
            el.appendChild(dot);
          }

          const closeBtn = document.createElement('span');
          closeBtn.className = 'tab-close';
          closeBtn.textContent = '×';
          closeBtn.title = 'Close tab';
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(tab.path);
          });
          el.appendChild(closeBtn);

          el.addEventListener('click', () => {
            activeTabPath = tab.path;
            renderTabs();
            renderActiveFile();
            renderTree();
          });

          tabsBar.appendChild(el);
        });
      }

      function updateTabState(tab) {
        renderTabs();
      }

      function closeTab(filePath) {
        const idx = openTabs.findIndex(t => t.path === filePath);
        if (idx === -1) return;
        const tab = openTabs[idx];
        if (tab.dirty) {
          if (!confirm(`Save changes to ${tab.name} before closing?`)) {
            // drop changes
          } else {
            saveCurrentFile();
          }
        }
        if (tab.model) tab.model.dispose();
        openTabs.splice(idx, 1);

        if (activeTabPath === filePath) {
          activeTabPath = openTabs.length > 0 ? openTabs[Math.max(0, idx - 1)].path : null;
        }
        renderTabs();
        renderActiveFile();
        renderTree();
      }

      function renderActiveFile() {
        const tab = openTabs.find(t => t.path === activeTabPath);
        if (!tab) {
          breadcrumb.textContent = 'No file selected';
          emptyState.style.display = 'flex';
          monacoRoot.style.display = 'none';
          imageViewer.style.display = 'none';
          tableViewer.style.display = 'none';
          fallbackTextarea.style.display = 'none';
          updateSaveBadge(true);
          return;
        }

        breadcrumb.textContent = tab.path;
        emptyState.style.display = 'none';
        updateSaveBadge(!tab.dirty);

        if (tab.isImg) {
          monacoRoot.style.display = 'none';
          tableViewer.style.display = 'none';
          fallbackTextarea.style.display = 'none';
          imageViewer.style.display = 'flex';
          imageElement.src = `${API_BASE}/file?path=${encodeURIComponent(tab.path)}&t=${Date.now()}`;
          return;
        }

        if (tab.isTable && tab.viewMode === 'table') {
          monacoRoot.style.display = 'none';
          imageViewer.style.display = 'none';
          fallbackTextarea.style.display = 'none';
          tableViewer.style.display = 'flex';
          renderTableContent(tab);
          return;
        }

        // Standard Text/Code Monaco editor
        imageViewer.style.display = 'none';
        tableViewer.style.display = 'none';
        if (editorInstance && tab.model) {
          monacoRoot.style.display = 'block';
          fallbackTextarea.style.display = 'none';
          editorInstance.setModel(tab.model);
          editorInstance.focus();
        } else {
          monacoRoot.style.display = 'none';
          fallbackTextarea.style.display = 'block';
          fallbackTextarea.value = tab.content;
        }
      }

      function renderTableContent(tab) {
        tableInfo.textContent = `${tab.name} (Table View)`;
        const lines = (tab.model ? tab.model.getValue() : tab.content).split('\n').filter(l => l.trim().length > 0);
        if (lines.length === 0) {
          tableContent.innerHTML = '<div style="padding: 12px; color: var(--text-muted);">Empty table</div>';
          return;
        }
        const delimiter = tab.ext === 'tsv' ? '\t' : ',';
        const headers = parseCsvLine(lines[0], delimiter);
        let html = '<table class="data-table"><thead><tr>';
        headers.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
        html += '</tr></thead><tbody>';
        lines.slice(1, 100).forEach(line => {
          const cells = parseCsvLine(line, delimiter);
          html += '<tr>';
          headers.forEach((_, i) => html += `<td>${escapeHtml(cells[i] || '')}</td>`);
          html += '</tr>';
        });
        html += '</tbody></table>';
        if (lines.length > 100) {
          html += `<div style="padding: 8px; color: var(--text-muted); text-align: center;">Showing first 100 rows of ${lines.length - 1}</div>`;
        }
        tableContent.innerHTML = html;
      }

      function parseCsvLine(text, delimiter) {
        return text.split(delimiter).map(c => c.replace(/^["']|["']$/g, '').trim());
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      tableToggleSource.addEventListener('click', () => {
        const tab = openTabs.find(t => t.path === activeTabPath);
        if (!tab) return;
        tab.viewMode = tab.viewMode === 'table' ? 'editor' : 'table';
        renderActiveFile();
      });

      function updateSaveBadge(state) {
        if (state === 'loading') {
          saveStatus.className = 'badge badge-saving';
          saveStatus.textContent = '⟳ Loading...';
        } else if (state === 'saving') {
          saveStatus.className = 'badge badge-saving';
          saveStatus.textContent = '⟳ Saving...';
        } else if (state === false) {
          saveStatus.className = 'badge badge-unsaved';
          saveStatus.textContent = '● Unsaved (Ctrl+S)';
        } else {
          saveStatus.className = 'badge badge-saved';
          saveStatus.textContent = '● Saved';
        }
      }

      async function saveCurrentFile() {
        if (!activeTabPath || isSaving) return;
        const tab = openTabs.find(t => t.path === activeTabPath);
        if (!tab || tab.isImg) return;

        isSaving = true;
        updateSaveBadge('saving');

        const currentContent = editorInstance && tab.model ? tab.model.getValue() : fallbackTextarea.value;
        try {
          const res = await fetch(`${API_BASE}/file?path=${encodeURIComponent(tab.path)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: currentContent })
          });
          if (!res.ok) throw new Error('Failed to save');
          tab.content = currentContent;
          tab.dirty = false;
          updateTabState(tab);
          updateSaveBadge(true);
        } catch (err) {
          alert(`Save error: ${err.message}`);
          updateSaveBadge(false);
        } finally {
          isSaving = false;
        }
      }

      saveBtn.addEventListener('click', () => saveCurrentFile());

      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          saveCurrentFile();
        }
      });

      // Initial load
      loadTree();
    })();
  </script>
</body>
</html>
