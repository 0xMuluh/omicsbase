<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmicsBase Editor</title>
  <link rel="stylesheet" href="/api/omicsbase/assets/editor.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="header-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span>WORKSPACE</span>
        </div>
        <span style="color: var(--border-light);">/</span>
        <span id="breadcrumb" class="file-breadcrumb">No file selected</span>
      </div>
      <div class="header-right">
        <span id="save-status" class="badge badge-saved">● Saved</span>
        <button id="save-btn" class="btn btn-primary" title="Save changes (Ctrl+S)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span>Save</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <!-- File Tree Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <span class="sidebar-title">Files</span>
            <div class="sidebar-actions">
              <button id="expand-all-btn" class="btn btn-icon" title="Expand all folders">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
              </button>
              <button id="collapse-all-btn" class="btn btn-icon" title="Collapse all folders">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 20 5-5 5 5"></path><path d="m7 4 5 5 5-5"></path></svg>
              </button>
              <button id="refresh-tree-btn" class="btn btn-icon" title="Refresh files">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              </button>
            </div>
          </div>
          <div class="search-box">
            <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="tree-search" type="text" class="search-input" placeholder="Search project files...">
            <button id="tree-search-clear" class="search-clear-btn" title="Clear search">×</button>
          </div>
        </div>
        <div id="tree-root" class="tree-scroll"></div>
      </aside>

      <!-- Main Editor Surface -->
      <main class="main-area">
        <div id="tabs-bar" class="tabs-bar"></div>
        <div class="editor-container">
          <div id="monaco-root"></div>
          <textarea id="fallback-textarea" spellcheck="false"></textarea>
          <div id="image-viewer">
            <img id="image-element" src="" alt="Image preview">
          </div>
          <div id="table-viewer">
            <div class="table-toolbar">
              <span id="table-info">Table Preview</span>
              <button id="table-toggle-source" class="btn btn-icon" title="Toggle raw source code">Edit Source</button>
            </div>
            <div id="table-content" class="table-scroll"></div>
          </div>
          <div id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
            <p>Select a file from the explorer to view or edit</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Monaco loader from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <script src="/api/omicsbase/assets/editor.js"></script>
</body>
</html>
